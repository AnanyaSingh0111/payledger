name: CI

on:
  push:
    branches: [main, deploy-v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: payledger_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci-password
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: >
          ./mvnw -B test
          -Dspring.datasource.url="jdbc:mysql://localhost:3306/payledger_test?createDatabaseIfNotExist=true"
          -Dspring.datasource.username="root"
          -Dspring.datasource.password="ci-password"