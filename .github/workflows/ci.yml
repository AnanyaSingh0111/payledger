name: CI

on:
  push:
    branches: [main, deploy-v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: payledger_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci-password
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: chmod +x mvnw

      - name: Run tests
        run: |
          set +e
          ./mvnw -B -e test
          TEST_EXIT_CODE=$?

          echo "===== SUREFIRE REPORT FILES ====="
          find target/surefire-reports -type f -maxdepth 1 -print

          echo "===== SUREFIRE TXT REPORTS ====="
          cat target/surefire-reports/*.txt || true

          echo "===== SUREFIRE XML REPORTS ====="
          cat target/surefire-reports/*.xml || true

          exit $TEST_EXIT_CODE