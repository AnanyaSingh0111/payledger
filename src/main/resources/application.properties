spring.application.name=payledger

# ---- database ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payledger?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# Flyway owns the schema; Hibernate only checks that the entities match it
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- server ----
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never

# ---- security ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
# Optional first admin, created on startup if it does not exist (password: 12+ characters)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---- background jobs ----
app.jobs.enabled=true
app.reconciliation.cron=${RECONCILIATION_CRON:0 0 2 * * *}
app.outbox.poll-interval-ms=2000
app.outbox.batch-size=50
app.outbox.max-attempts=8

# ---- fraud rules ----
app.fraud.daily-limit=200000.00
app.fraud.large-amount=50000.00
app.fraud.rapid-window-seconds=60
app.fraud.rapid-max-transfers=10

# ---- ops ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.operations-sorter=method
