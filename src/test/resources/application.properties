# Tests run against a real MySQL database (locking and isolation behaviour cannot be faked).
# Credentials come from environment variables, or from an optional, git-ignored
# test-db.properties file in the project root, e.g.
#   SPRING_DATASOURCE_PASSWORD=your-local-mysql-password
spring.config.import=optional:file:./test-db.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payledger_test?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=40

# The schema is rebuilt from the Flyway migrations at the start of the run (see CleanDatabaseConfig)
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=test-secret-test-secret-test-secret-123456
app.jwt.expiration-ms=3600000

# Scheduled jobs are off; tests call the outbox relay and reconciliation directly
app.jobs.enabled=false

server.port=0
logging.level.payledger.events=WARN
